[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-scan"
dynamic = ["version"]
description = "CLI toolkit for scanning and identifying embedded hardware interfaces (JTAG, UART, pin status) via Digilent and Saleae backends"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["jtag", "uart", "embedded", "hardware", "digilent", "saleae", "scan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dwf    = ["dwfpy>=1.2.0"]
saleae = ["saleae>=0.12.0"]
all    = ["dwfpy>=1.2.0", "saleae>=0.12.0"]
dev    = [
    "pytest>=9",
    "dwfpy>=1.2.0",
    "saleae>=0.12.0",
]

[project.scripts]
embed-scan = "embed_scan:main_program"

[project.urls]
Homepage   = "https://github.com/your-org/embed-scan"
Repository = "https://github.com/your-org/embed-scan"
Issues     = "https://github.com/your-org/embed-scan/issues"
Changelog  = "https://github.com/your-org/embed-scan/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# setuptools: include all Python packages and top-level modules
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["features*", "hardware_backend*"]
exclude = ["tests*", "_Archive*"]

# embed_scan is a single-file module, not a package
[tool.setuptools]
py-modules = ["embed_scan"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# ---------------------------------------------------------------------------
# setuptools-scm: derive __version__ from git tags
# Written to a standalone file imported by embed_scan.__version__
# ---------------------------------------------------------------------------
[tool.setuptools_scm]
version_file   = "_version.py"
version_scheme = "post-release"
local_scheme   = "dirty-tag"
fallback_version = "0.0.0"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
